name: Tauri release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check

  release:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
            rust-targets: 'x86_64-pc-windows-msvc'
          - platform: ubuntu-22.04
            args: '--target x86_64-unknown-linux-gnu --bundles appimage,deb'
            rust-targets: 'x86_64-unknown-linux-gnu'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Open Cloud v__VERSION__'
          releaseBody: |
            Open Cloud 3.6.2 restores missing collection, watch-history, and playback-progress data
            from all recoverable Open Cloud stores. Synchronization is now account-scoped,
            non-destructive, uncapped, and merges local and cloud records without dropping entries.
            Explicit removals use timestamped deletion markers, media types cannot collide, and
            protected daily server snapshots provide a recovery path before synchronization. Legacy
            checkpoints without a media-type label are safely inferred and recovered to cloud.
            Linux is now a first-class release target with signed AppImage updater artifacts and
            a native Debian package alongside the existing macOS and Windows builds.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  finalize:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct updater URLs and publish verified release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          mkdir -p updater-manifest
          gh release download "$TAG" --pattern latest.json --dir updater-manifest
          node scripts/fix-updater-manifest.mjs updater-manifest/latest.json "$RELEASE_REPOSITORY" "$TAG"
          gh release upload "$TAG" updater-manifest/latest.json --clobber
          gh release edit "$TAG" --draft=false --latest
