name: Tauri release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-latest
    env:
      TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node scripts/check-build-env.mjs
      - run: npm run check

  release:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            wayland_smoke: false
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
            rust-targets: 'x86_64-pc-windows-msvc'
            wayland_smoke: false
          - platform: windows-11-arm
            args: '--target aarch64-pc-windows-msvc --bundles nsis'
            rust-targets: 'aarch64-pc-windows-msvc'
            wayland_smoke: false
          - platform: ubuntu-22.04
            args: '--target x86_64-unknown-linux-gnu --bundles appimage,deb'
            rust-targets: 'x86_64-unknown-linux-gnu'
            wayland_smoke: false
          - platform: ubuntu-24.04-arm
            args: '--target aarch64-unknown-linux-gnu --bundles appimage,deb'
            rust-targets: 'aarch64-unknown-linux-gnu'
            wayland_smoke: true
    runs-on: ${{ matrix.platform }}
    env:
      TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install ARM64 Wayland smoke-test dependencies
        if: matrix.wayland_smoke
        run: sudo apt-get install -y weston
      - run: npm ci
      - run: node scripts/check-build-env.mjs
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'Open Cloud v__VERSION__'
          releaseBody: |
            Open Cloud 3.9.0 adds a Linux ARM64 WebKitGTK compatibility profile for the OnePlus 6
            running Kupfer Linux and Hyprland, while preserving the existing interface. It prefers
            native Wayland, automatically avoids the problematic DMA-BUF renderer on detected
            OnePlus 6 hardware, allows phone-sized windows, and bundles the AppImage media framework.
            The ARM64 AppImage is also smoke-tested in a native ARM64 headless Wayland session before
            this draft can be published. Existing Windows, macOS, and Linux packages remain included.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
      - name: Smoke test ARM64 AppImage in Wayland WebKitGTK
        if: matrix.wayland_smoke
        run: scripts/smoke-linux-arm64-wayland.sh

  finalize:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct updater URLs and publish verified release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          mkdir -p updater-manifest
          gh release download "$TAG" --pattern latest.json --dir updater-manifest
          node scripts/fix-updater-manifest.mjs updater-manifest/latest.json "$RELEASE_REPOSITORY" "$TAG"
          gh release download "$TAG" --pattern '*.sig' --dir updater-manifest
          gh release view "$TAG" --json assets > updater-manifest/assets.json
          node scripts/verify-updater-assets.mjs updater-manifest/latest.json updater-manifest/assets.json updater-manifest
          gh release upload "$TAG" updater-manifest/latest.json --clobber
          gh release edit "$TAG" --draft=false --latest
