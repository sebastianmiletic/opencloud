<section id="logs-page" class="sub-page">
    <div class="view-header">
        <button class="btn-back" id="btn-back" title="Go back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <h3 data-i18n="tools_logs_activity">Activity Logs</h3>
    </div>

    <div class="date-picker-container">
        <div class="logs-toolbar">
            <div class="date-picker-wrapper">
                <div class="input-with-icon">
                    <input type="button" id="current-date-input"
                           placeholder="DD/MM/YYYY"
                           maxlength="10"
                           autocomplete="off">

                    <button id="calendar-trigger" class="calendar-trigger-btn" title="Open calendar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                             stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </button>
                </div>

                <div class="calendar-dropdown" id="calendar-dropdown">
                    <div class="calendar-header">
                        <button class="cal-nav" id="prev-month">‹</button>
                        <span class="cal-month" id="month-year-display">January 2026</span>
                        <button class="cal-nav" id="next-month">›</button>
                    </div>
                    <div class="calendar-days-grid" id="calendar-days">
                    </div>
                </div>
            </div>

            <div class="search-wrapper">
                <button id="search-trigger" class="icon-btn search-btn" title="Search logs">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                         stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>

                <div id="search-popup" class="search-popup">
                    <div class="search-input-wrapper">
                        <input type="text" id="search-input" placeholder="Search domain..." data-i18n="tools_logs_search_domain" autocomplete="off">
                        <button id="clear-search" class="clear-search-btn" title="Clear search" style="display: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="log-container" id="log-container">

    </div>
</section>
